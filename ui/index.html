<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deep Signal — Repo Risk</title>
  <style>
    :root{
      --bg: #0b0f17;
      --panel: #0f172a;
      --card: #111827;
      --card2:#0b1220;
      --border: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --muted2: rgba(255,255,255,.45);
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 
"Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 
Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(99,102,241,.35), 
transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(16,185,129,.25), 
transparent 55%),
        radial-gradient(900px 600px at 70% 120%, rgba(239,68,68,.18), 
transparent 55%),
        var(--bg);
      min-height: 100vh;
    }

    .wrap{
      max-width: 1100px;
      margin: 28px auto 60px;
      padding: 0 18px;
    }

    .topbar{
      display:flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .brand{
      display:flex;
      flex-direction: column;
      gap: 6px;
    }

    .title{
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .subtitle{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.06), 
rgba(255,255,255,.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      align-items: center;
    }

    input[type="text"]{
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    input[type="text"]::placeholder{ color: rgba(255,255,255,.35); }

    .btn{
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform .06s ease, background .15s ease, border-color 
.15s ease;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,.12); }
    .btn:active{ transform: translateY(1px); }

    .tog{
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted);
      font-size: 13px;
      user-select:none;
      white-space: nowrap;
    }
    .tog input{ transform: translateY(1px); }

    .grid{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      margin-top: 14px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), 
rgba(255,255,255,.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .card h3{
      margin: 0 0 10px;
      font-size: 14px;
      color: rgba(255,255,255,.85);
      letter-spacing: .2px;
    }

    .kvs{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .kv{
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
    }
    .kv .k{
      font-size: 12px;
      color: var(--muted2);
      margin-bottom: 6px;
    }
    .kv .v{
      font-size: 15px;
      font-weight: 800;
      display:flex;
      align-items: baseline;
      gap: 10px;
    }
    .pill{
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: rgba(255,255,255,.85);
      background: rgba(255,255,255,.06);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .barrow{
      margin-top: 12px;
      display:flex;
      flex-direction: column;
      gap: 6px;
    }
    .barhead{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 12px;
      color: var(--muted);
    }
    .bar{
      height: 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      overflow: hidden;
      position: relative;
    }
    .fill{
  height: 100%;
  width: 0%;
  background-color: #22c55e; /* default; overridden per bar */
  border-radius: 999px;
  transition: width .35s ease, background-color .2s ease;
}
    .drivers{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .driver{
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      border-radius: 14px;
      padding: 10px;
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .driver .name{
      font-weight: 800;
      font-size: 13px;
    }
    .driver .num{
      font-family: var(--mono);
      color: rgba(255,255,255,.75);
      font-size: 12px;
    }

    .features{
      margin-top: 14px;
    }
    .feat-tools{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .search{
      width: 320px;
      max-width: 100%;
    }

    .table{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }

    .row{
      border: 1px solid var(--border);
      background: rgba(0,0,0,.16);
      border-radius: 16px;
      padding: 12px;
    }
    .row.missing{
      opacity: .58;
    }

    .rowtop{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .left{
      min-width: 0;
    }
    .name{
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .2px;
      display:flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .cat{
      font-size: 11px;
      color: rgba(255,255,255,.72);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      font-weight: 800;
      letter-spacing: .4px;
    }
    .desc{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 6px;
    }

    .right{
      text-align: right;
      flex: 0 0 auto;
    }
    .raw{
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.80);
    }
    .raw .u{
      color: rgba(255,255,255,.55);
      margin-left: 6px;
    }
    .meta2{
      margin-top: 6px;
      font-size: 11px;
      color: rgba(255,255,255,.55);
      display:flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .mini{
      height: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      overflow:hidden;
    }
    .mini .fill{
      height:100%;
      border-radius: 999px;
    }

    .foot{
      margin-top: 12px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      line-height: 1.4;
    }

    .err{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(239,68,68,.45);
      background: rgba(239,68,68,.10);
      color: rgba(255,255,255,.88);
      font-size: 13px;
      display:none;
      white-space: pre-wrap;
    }

    @media (max-width: 920px){
      .grid{ grid-template-columns: 1fr; }
      .controls{ grid-template-columns: 1fr auto; grid-auto-rows: auto; }
      .tog{ justify-content: flex-end; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">Deep Signal — Repository Risk</div>
        <div class="subtitle">
          Enter a repo, pull a payload from 
your local API, render overall + feature-level risk bars.
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="controls">
        <input id="repoInput" type="text" placeholder="e.g. numpy/numpy or 
https://github.com/numpy/numpy" />
        <button id="scoreBtn" class="btn">Score</button>
        <label class="tog">
          <input id="refreshToggle" type="checkbox" />
          force refresh
        </label>
        
        <label class="tog">
          <input id="issuesToggle" type="checkbox" checked />
          thorough mode (fetch issues, slower)
        </label>
        
      </div>
      <div id="err" class="err"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Overall</h3>
        <div class="kvs">
          <div class="kv">
            <div class="k">Repo</div>
            <div class="v"><span id="repoName">—</span></div>
          </div>
          <div class="kv">
            <div class="k">Score</div>
            <div class="v">
              <span id="overallScore">—</span>
              <span id="overallLabel" class="pill">—</span>
            </div>
          </div>
          <div class="kv">
            <div class="k">Coverage</div>
            <div class="v"><span id="coverage">—</span></div>
          </div>
          <div class="kv">
            <div class="k">Confidence</div>
            <div class="v"><span id="confidence">—</span></div>
          </div>
        </div>

        <div class="barrow">
          <div class="barhead">
            <span>Maintenance risk (0 → low, 1 → high)</span>
            <span id="fetchedAt" style="font-family:var(--mono); color: 
rgba(255,255,255,.55);">—</span>
          </div>
          <div class="bar"><div id="overallFill" class="fill"></div></div>
        </div>

        <div class="foot" id="cacheMeta">—</div>
      </div>

      <div class="card">
        <h3>Top drivers</h3>
        <div id="drivers" class="drivers"></div>
      </div>
    </div>

    <div class="features">
      <div class="card">
        <div class="feat-tools">
          <h3 style="margin:0;">Features</h3>
          <input id="search" class="search" type="text" 
placeholder="Filter features (e.g. issues, push, contributors)" />
        </div>
        <div id="features" class="table"></div>
      </div>
    </div>
  </div>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  const el = (id) => document.getElementById(id);

  function clamp01(x){
    if (x == null || Number.isNaN(x)) return 0;
    return Math.max(0, Math.min(1, x));
  }
  function riskToColor(score){
  const n = Number(score);
  if (score == null || Number.isNaN(n)) return "#9ca3af"; // gray for missing
  const s = clamp01(n);
  const hue = 120 * (1 - s); // 120=green, 0=red
  return `hsl(${hue}, 75%, 50%)`;
}

  function fmtNum(x, digits=4){
    if (x == null) return "—";
    const n = Number(x);
    if (Number.isNaN(n)) return String(x);
    if (Math.abs(n) >= 1000) return n.toFixed(0);
    if (Math.abs(n) >= 100) return n.toFixed(1);
    if (Math.abs(n) >= 10) return n.toFixed(2);
    return n.toFixed(digits);
  }

  function prettyKey(k){
    return (k || "").replaceAll("_"," ");
  }

  function showError(msg){
    const box = el("err");
    box.style.display = msg ? "block" : "none";
    box.textContent = msg || "";
  }

  function setLoading(isLoading){
    const btn = el("scoreBtn");
    btn.textContent = isLoading ? "Scoring…" : "Score";
    btn.disabled = !!isLoading;
  }

  function renderDrivers(payload){
    const box = el("drivers");
    box.innerHTML = "";
    const drivers = payload?.top_drivers || [];
    if (!drivers.length){
      box.innerHTML = `<div style="color:rgba(255,255,255,.55); 
font-size:13px;">No drivers available.</div>`;
      return;
    }
    for (const d of drivers){
      const div = document.createElement("div");
      div.className = "driver";
      div.innerHTML = `
        <div class="name">${prettyKey(d.key)}</div>
        <div class="num">${fmtNum(d.contribution, 6)}</div>
      `;
      box.appendChild(div);
    }
  }

  function renderFeatures(payload){
    const box = el("features");
    box.innerHTML = "";
    const rows = payload?.features || [];
    const q = (el("search").value || "").toLowerCase().trim();

    const filtered = !q ? rows : rows.filter(r => {
      const hay = [
        r.key, r.label, r.category, r.status, r.unit,
        (r.explanation || ""),
        JSON.stringify(r.interpretation || {})
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });

    if (!filtered.length){
      box.innerHTML = `<div style="color:rgba(255,255,255,.55); 
font-size:13px;">No matching features.</div>`;
      return;
    }

    for (const f of filtered){
      const missing = (f.status === "missing");
      const missingReason =
  (!document.getElementById("issuesToggle").checked && f.category === "Issues")
    ? "Not computed in Quick mode"
    : (f.status === "missing" ? "Data unavailable" : null);
      const risk = f.risk_score;
      const pct = Math.round(clamp01(risk) * 100);

      const raw = (f.raw_value === null || f.raw_value === undefined) ? 
"—" : fmtNum(f.raw_value, 6);
      const unit = f.unit ? `<span class="u">${f.unit}</span>` : "";

      const metaBits = [];
      if (f.risk_label) metaBits.push(`risk: ${f.risk_label}`);
      if (missingReason) metaBits.push(missingReason);
      if (f.status) metaBits.push(`status: ${f.status}`);
      metaBits.push(`weight: ${fmtNum(f.weight, 4)}`);
      if (f.contribution != null) metaBits.push(`contrib: 
${fmtNum(f.contribution, 6)}`);

      const row = document.createElement("div");
      row.className = "row" + (missing ? " missing" : "");
      row.innerHTML = `
        <div class="rowtop">
          <div class="left">
            <div class="name">
              <span>${f.label || prettyKey(f.key)}</span>
              <span class="cat">${f.category || "Other"}</span>
            </div>
            <div class="desc">${f.explanation ? f.explanation : ""}</div>
          </div>
          <div class="right">
            <div class="raw">${raw}${unit}</div>
            <div class="meta2">${metaBits.map(s => 
`<span>${s}</span>`).join("")}</div>
          </div>
        </div>
        <div class="mini" title="risk_score: ${risk == null ? '—' : 
risk}">
          <div class="fill" style="width:${pct}%; background-color:${riskToColor(risk)}"></div>
        </div>
      `;
      box.appendChild(row);
    }
  }

  function renderOverall(payload){
    el("repoName").textContent = payload?.repo?.full_name || "—";
    el("overallScore").textContent = payload?.overall?.maintenance_risk != 
null ? fmtNum(payload.overall.maintenance_risk, 6) : "—";
    el("overallLabel").textContent = (payload?.overall?.maintenance_label 
|| "—");
    el("coverage").textContent = payload?.overall?.coverage != null ? 
fmtNum(payload.overall.coverage, 4) : "—";
    el("confidence").textContent = payload?.overall?.confidence || "—";

    const fill = el("overallFill");
    const pct = Math.round(clamp01(payload?.overall?.maintenance_risk) * 
100);
    fill.style.width = pct + "%";
    fill.style.backgroundColor = riskToColor(payload?.overall?.maintenance_risk);

    const fetchedAt = payload?.meta?.fetched_at || "—";
    el("fetchedAt").textContent = fetchedAt;

    const cache = payload?.meta?.cache_status || "—";
const mode = document.getElementById("issuesToggle").checked
  ? "Thorough mode (issues fetched)"
  : "Quick mode (issues not fetched)";

el("cacheMeta").textContent =
  `${mode} • cache: ${cache}`;

  }

  async function score(){
    showError("");
    setLoading(true);

    const repo = el("repoInput").value.trim() || "numpy/numpy";
    const refresh = el("refreshToggle").checked;
    const fetchIssues = el("issuesToggle").checked;

    const url = new URL(API_BASE + "/api/score");
    url.searchParams.set("repo", repo);
    url.searchParams.set("refresh", String(refresh));
    url.searchParams.set("fetch_issues", String(fetchIssues));

    try{
      const res = await fetch(url.toString());
      const text = await res.text();
      if (!res.ok){
        throw new Error(`HTTP ${res.status}\n` + text);
      }
      const payload = JSON.parse(text);

      renderOverall(payload);
      renderDrivers(payload);
      renderFeatures(payload);
    }catch(e){
      showError(String(e));
    }finally{
      setLoading(false);
    }
  }

  el("scoreBtn").addEventListener("click", score);
  el("repoInput").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") score();
  });
  el("search").addEventListener("input", () => {
    // re-render features only (keep payload in DOM state via last render)
    // simplest approach: call score again if you want; here we just 
re-filter
    // We'll store the last payload globally.
  });

  // Keep last payload for filtering without refetch
  let _lastPayload = null;
  const _renderFeaturesOrig = renderFeatures;
  renderFeatures = function(payload){
    _lastPayload = payload;
    _renderFeaturesOrig(payload);
  };
  el("search").addEventListener("input", () => {
    if (_lastPayload) _renderFeaturesOrig(_lastPayload);
  });

  // initial
  el("repoInput").value = "numpy/numpy";
  score();
</script>
</body>
</html>
