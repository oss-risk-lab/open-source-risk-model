maintenance_composite:
  feature_weights:
    # Tier 1 — primary activity signals (equal weight)
    days_since_last_push:    0.14
    days_since_last_release: 0.14
    contributors_last_12mo:  0.14

    # Tier 2 — concentration and responsiveness
    top_contributor_fraction_12mo: 0.12
    issues_per_contributor:        0.10
    fraction_issues_closed_12mo:   0.10

    # Tier 3 — health indicators
    fraction_open_issues_stale_180d: 0.08
    archived:    0.08
    stars_count: 0.04

    # Tier 4 — issue response quality
    avg_time_to_first_maintainer_response_days: 0.03
    fraction_unanswered_after_30d:              0.02
    median_time_to_close_days:                  0.01
    open_issue_age_p90_days:                    0.00
                

  bands:
    - name: low
      max: 0.25
    - name: medium
      max: 0.50
    - name: high
      max: 0.75
    - name: critical
      max: 1.00

